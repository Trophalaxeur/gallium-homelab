---
# Required collections (install once on the control node):
#   ansible-galaxy collection install -r ansible/requirements.yml

- name: Deploy AdGuard Home
  hosts: adguard
  become: true
  gather_facts: false

  # Variables publiques : ansible/group_vars/all/vars.yml
  # Secrets       : ansible/group_vars/all/vault.yml (gitignored — ansible-vault)

  pre_tasks:
    # ssh-keyscan auto-population is TOFU — acceptable on a freshly provisioned
    # LXC in a controlled homelab network. Restrict to ed25519 to avoid
    # recording multiple key types unexpectedly.
    # For higher-security contexts: pin expected fingerprints out-of-band
    # (Proxmox console → check /etc/ssh/ssh_host_ed25519_key.pub).
    # No 'always' tag: the adguard play is run as a whole, not with --tags filters.
    # Pair --tags phase1/phase2 (neon) with --limit neon to avoid touching adguard.
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false

    - name: Gather facts
      ansible.builtin.gather_facts:

  roles:
    - adguard-home

  # Generate the adguard→bromine cert deploy keypair HERE (idempotent via
  # creates:), so the private half is born on adguard — where acme.sh's ssh
  # deploy-hook uses it (see bromine-cert role) — and never has to live in
  # vault. The bromine play (later) reads the public half from this host's
  # facts to authorize it on bromine's certdeploy user. Rebuilding adguard
  # regenerates the key → re-run `--limit adguard,bromine` once to re-sync.
  post_tasks:
    - name: Generate adguard→bromine cert deploy keypair
      command: ssh-keygen -t ed25519 -f /root/.ssh/bromine-cert-deploy -N "" -C "acme deploy adguard->bromine"
      args:
        creates: /root/.ssh/bromine-cert-deploy

    - name: Read the cert deploy public key
      slurp:
        src: /root/.ssh/bromine-cert-deploy.pub
      register: bromine_cert_deploy_pub

    - name: Expose the cert deploy public key to the bromine play
      set_fact:
        bromine_cert_deploy_pubkey: "{{ bromine_cert_deploy_pub.content | b64decode | trim }}"

    # Same mechanism, second keypair — immich gets its own so a compromised
    # immich LXC can't reuse bromine's deploy key (or vice versa).
    - name: Generate adguard→immich cert deploy keypair
      command: ssh-keygen -t ed25519 -f /root/.ssh/immich-cert-deploy -N "" -C "acme deploy adguard->immich"
      args:
        creates: /root/.ssh/immich-cert-deploy

    - name: Read the immich cert deploy public key
      slurp:
        src: /root/.ssh/immich-cert-deploy.pub
      register: immich_cert_deploy_pub

    - name: Expose the immich cert deploy public key to the immich play
      set_fact:
        immich_cert_deploy_pubkey: "{{ immich_cert_deploy_pub.content | b64decode | trim }}"

- name: Deploy neon agent platform
  hosts: neon
  become: true
  gather_facts: false   # gather AFTER known_hosts pre_task to avoid TOFU on first run

  # Phase 1 (infra + tooling): ansible-playbook playbook.yml --tags phase1
  # Phase 2 (multica cloud auth + daemon): ansible-playbook playbook.yml --tags phase2
  #
  # Vault vars required — add via `ansible-vault edit group_vars/all/vault.yml`:
  #   vault_smtp_password, vault_claude_oauth_token
  #   vault_gh_admin_token   (Phase 1)
  #   vault_multica_pat      (Phase 2 — Multica cloud API token)

  pre_tasks:
    # ssh-keyscan auto-population is TOFU — acceptable on a freshly provisioned
    # LXC in a controlled homelab network. Restrict to ed25519 to avoid
    # recording multiple key types unexpectedly.
    # For higher-security contexts: pin expected fingerprints out-of-band
    # (Proxmox console → check /etc/ssh/ssh_host_ed25519_key.pub).
    # 'always' tag ensures these run even under --tags phase1/phase2 filters
    # (without it, --tags phase1 would skip pre_tasks → SSH/facts broken).
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  roles:
    - neon-agent

- name: Deploy bromine CV-tailoring backend
  hosts: bromine
  become: true
  gather_facts: false   # gather AFTER known_hosts pre_task to avoid TOFU on first run

  # Vault vars required — add via `ansible-vault edit group_vars/all/vault.yml`:
  #   vault_smtp_password, vault_gh_admin_token
  #   vault_anthropic_api_token, vault_google_client_id, vault_google_client_secret
  #   vault_bromine_allowed_emails

  pre_tasks:
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  roles:
    - bromine-agent

# Runs on adguard (which already has acme.sh + the Online.net DNS key), but
# deploys the cert TO bromine over SSH. Placed AFTER the bromine play so that
# certdeploy + Caddy + /etc/caddy/cert already exist on the target.
# NOTE: pushing the cert requires adguard in scope — deploy with
# `--limit adguard,bromine`, not `--limit bromine` alone.
- name: Issue + deploy bromine TLS certificate (from adguard)
  hosts: adguard
  become: true
  gather_facts: false   # known_hosts already accepted by the AdGuard play above

  # Vault vars required — add via `ansible-vault edit group_vars/all/vault.yml`:
  #   online_api_key   (shared — also used by adguard-home)
  # The ssh deploy key is generated by the AdGuard play above (not in vault).

  roles:
    - bromine-cert

# Docker Compose deployment (server, machine-learning, postgres, redis) +
# Caddy reverse proxy, same TLS pattern as bromine. Decisions Révision 3 of
# ~/.claude/plans/backup-strategy.md: Docker Compose runtime, ML enabled,
# pinned image versions. NOTE — required run order (not the same as this
# file's play order): 1) the "Provision ZFS dataset for Immich photos" play
# (further down this file, hosts: proxmox) must run first, 2) then
# `terraform apply` creates the LXC with its mount_point pointing at that
# dataset (terraform/immich.tf), 3) only then can this play reach the immich
# host and succeed. Run each step explicitly (e.g. `--limit proxmox` first),
# don't rely on a single unlimited `ansible-playbook playbook.yml` run.
- name: Deploy Immich (Docker Compose, ML enabled)
  hosts: immich
  become: true
  gather_facts: false

  # Vault vars required — add via `ansible-vault edit group_vars/all/vault.yml`:
  #   vault_immich_db_password

  pre_tasks:
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  roles:
    - immich

# Runs on adguard, deploys the cert TO immich over SSH. Placed AFTER the
# immich play so that certdeploy + Caddy + /etc/caddy/cert already exist on
# the target. NOTE: pushing the cert requires adguard in scope — deploy with
# `--limit adguard,immich`, not `--limit immich` alone.
- name: Issue + deploy immich TLS certificate (from adguard)
  hosts: adguard
  become: true
  gather_facts: false   # known_hosts already accepted by the AdGuard play above

  # Vault vars required — add via `ansible-vault edit group_vars/all/vault.yml`:
  #   online_api_key   (shared — also used by adguard-home/bromine-cert)
  # The ssh deploy key is generated by the AdGuard play above (not in vault).

  roles:
    - immich-cert

# PBS installed inside its own LXC (per CLAUDE.md: no services on the PVE host
# itself). Sets facts (token id/secret, cert fingerprint) consumed by the next
# play to register the storage on gallium — both plays must run together
# (`--limit pbs,proxmox`), same cross-host fact pattern as adguard→bromine.
- name: Deploy PBS (Proxmox Backup Server)
  hosts: pbs
  become: true
  gather_facts: false

  pre_tasks:
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  roles:
    - pbs

- name: Register PBS storage and daily backup job on the Proxmox host
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    pbs_storage_name: "pbs"
    pbs_backup_job_id: "pbs-daily-lxc-sys"
    pbs_backup_vmids: "100,101,102,104,105"   # adguard, neon, bromine, immich, backup (rootfs only — photos/HDD bind-mounts excluded, cf. Étape 3/3-bis)

  pre_tasks:
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  tasks:
    - name: Check if PBS storage is already registered
      ansible.builtin.command: pvesm status --storage {{ pbs_storage_name }}
      register: pbs_storage_check
      failed_when: false
      changed_when: false

    - name: Register PBS storage
      ansible.builtin.command: >
        pvesm add pbs {{ pbs_storage_name }}
        --server {{ hostvars['pbs.lan']['pbs_ip'] }}
        --datastore {{ hostvars['pbs.lan']['pbs_datastore_name'] }}
        --username {{ hostvars['pbs.lan']['pbs_sync_token_id'] }}
        --password {{ hostvars['pbs.lan']['pbs_sync_token_secret'] }}
        --fingerprint {{ hostvars['pbs.lan']['pbs_cert_fingerprint'] }}
      when: pbs_storage_check.rc != 0
      no_log: true

    - name: Check existing backup jobs
      ansible.builtin.command: pvesh get /cluster/backup --output-format json
      register: pbs_backup_jobs
      changed_when: false

    - name: Create daily PBS backup job (adguard/neon/bromine/immich, 30d retention)
      ansible.builtin.command: >
        pvesh create /cluster/backup
        --id {{ pbs_backup_job_id }}
        --enabled 1
        --schedule "02:30"
        --storage {{ pbs_storage_name }}
        --vmid "{{ pbs_backup_vmids }}"
        --mode snapshot
        --prune-backups "keep-daily=30"
        --node {{ proxmox_node }}
        --comment "PBS daily backup - adguard/neon/bromine/immich/backup (ansible-managed)"
      when: pbs_backup_job_id not in (pbs_backup_jobs.stdout | from_json | map(attribute='id') | list)

    # `pvesh create` above only runs once (job absent). When the job already
    # exists but pbs_backup_vmids has grown (e.g. immich added after the
    # initial run), the create task is skipped and the job would silently keep
    # backing up only the old vmid list — so reconcile it explicitly here.
    - name: Keep the PBS backup job's vmid list in sync
      ansible.builtin.command: >
        pvesh set /cluster/backup/{{ pbs_backup_job_id }}
        --vmid "{{ pbs_backup_vmids }}"
      when:
        - pbs_backup_job_id in (pbs_backup_jobs.stdout | from_json | map(attribute='id') | list)
        - (pbs_backup_jobs.stdout | from_json | selectattr('id', 'equalto', pbs_backup_job_id) | map(attribute='vmid') | first) != pbs_backup_vmids

# Standalone ZFS dataset for Immich photos+DB dumps (backup=no equivalent: not
# a container rootfs, excluded from PBS by nature, protected instead by sanoid
# + rclone — see ~/.claude/plans/backup-strategy.md, Étape 3). Must exist before
# the immich LXC is created (Terraform mount_point references this path) and
# before the zfs-maintenance play below applies its sanoid template.
- name: Provision ZFS dataset for Immich photos
  hosts: proxmox
  become: true
  gather_facts: false

  pre_tasks:
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  tasks:
    - name: Check if the immich-photos dataset already exists
      ansible.builtin.command: zfs list -H -o name {{ immich_photos_dataset }}
      register: immich_dataset_check
      failed_when: false
      changed_when: false

    - name: Create the immich-photos ZFS dataset
      ansible.builtin.command: zfs create {{ immich_photos_dataset }}
      when: immich_dataset_check.rc != 0

    # The immich LXC (104) is unprivileged: its root (uid/gid 0) maps to host
    # uid/gid 100000 (default Proxmox range, /etc/subuid|subgid "root:100000:
    # 65536"). Bind-mounted as-is, this dataset is owned by host root (0:0),
    # which shows up as nobody:nogroup inside the LXC — the immich-server
    # container (runs as root in its own image, i.e. LXC-root) then gets
    # EACCES trying to write to /data. Chowning to the mapped root here makes
    # it appear as root:root from inside the LXC, where Docker can write.
    - name: Own the immich-photos dataset by the immich LXC's mapped root uid/gid
      ansible.builtin.file:
        path: "/{{ immich_photos_dataset }}"
        owner: "100000"
        group: "100000"
        state: directory

# ZFS maintenance itself (sanoid config incl. the photos template) runs below,
# after the dataset above is guaranteed to exist.
#
# Vault vars required — add via `ansible-vault edit group_vars/all/vault.yml`:
#   vault_smtp_password   (shared — also used by neon/bromine)
- name: ZFS maintenance on the Proxmox host (sanoid snapshots, ZED mail, monthly scrub)
  hosts: proxmox
  become: true
  gather_facts: false

  pre_tasks:
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  roles:
    - zfs-maintenance

# Isolated backup LXC (105) — runs the rclone/HDD/Object-Lock jobs (Étape 4 of
# ~/.claude/plans/backup-strategy.md). Prerequisites (must be done first):
#   1) The "Provision ZFS dataset for Immich photos" play + the immich LXC exist
#      (this LXC read-only bind-mounts that dataset).
#   2) The external HDD is mounted host-side on /mnt/hdd-external (Étape 0-bis).
#   3) `terraform apply` created LXC 105 with its two bind-mounts. The scoped
#      Terraform token can't post bind-mounts (403 root@pam) — post them once on
#      the Proxmox root console, see terraform/backup.tf.
#
# Vault vars required — add via `ansible-vault edit group_vars/all/vault.yml`:
#   vault_smtp_password              (shared — also used by neon/bromine)
#   vault_rclone_scaleway_access_key / vault_rclone_scaleway_secret_key
#     (scoped Scaleway IAM key: Put/Get only, Delete*/PutBucketVersioning denied)
#   vault_hc_uuid_rclone_scaleway / vault_hc_uuid_rclone_hdd
#   vault_hc_uuid_object_lock_renew  (healthchecks.io ping UUIDs)
- name: Deploy the isolated backup LXC (rclone → Scaleway/HDD, Object Lock renewal)
  hosts: backup
  become: true
  gather_facts: false

  pre_tasks:
    - name: Accept host key
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + ansible_host) }}"
        state: present
      delegate_to: localhost
      become: false
      tags: always

    - name: Gather facts
      ansible.builtin.gather_facts:
      tags: always

  roles:
    - backup

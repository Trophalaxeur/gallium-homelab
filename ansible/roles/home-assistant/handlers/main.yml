---
# HA only reads configuration.yaml and the automation includes at startup, so a
# config change needs a container restart (not a reload).
- name: Restart home assistant
  ansible.builtin.command: docker compose restart homeassistant
  args:
    chdir: "{{ homeassistant_install_dir }}"
  # A notified handler always performs the restart, so the task is genuinely
  # "changed" every time it runs. Stating it explicitly is also what satisfies
  # ansible-lint's no-changed-when on a command task.
  changed_when: true
  # Skipped when `docker compose up -d` (Start Home Assistant) just created or
  # recreated the homeassistant container in this run (image bump): it already
  # booted on the new config and integrations, a restart would only boot it a
  # second time a few seconds later (seen 2026-11-11: unfinished recorder
  # session). A change WITHOUT a recreate still restarts it.
  when: >-
    not ((ha_compose_up.stderr | default('')) ~ (ha_compose_up.stdout | default('')))
    is search('Container homeassistant\s+(Creat|Recreat|Start)')

# reload (not restart): picks up Caddyfile changes without dropping the
# listener. Caddy validates on reload and keeps the old config on failure, so a
# reload before the cert has been pushed from adguard is a safe no-op error
# rather than an outage.
- name: Reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  failed_when: false

---
homeassistant_install_dir: /opt/home-assistant
# Port Caddy proxies to. It does NOT configure Home Assistant: since 2026.8 the
# server port is a UI setting (Settings → System → Network, default 8123) and
# this value must match it. With network_mode: host (docker-compose.yml.j2)
# HA binds it on the LXC itself — Caddy fronts it on :443.
homeassistant_port: 8123
# Drives HA's sun/scheduling and the recorder timestamps. Must match the
# physical location, not the host's locale.
homeassistant_timezone: "Europe/Paris"
# Where the private config files are staged and validated before being
# copied into config/ (tasks/main.yml). Kept OUTSIDE config/ on purpose: HA must
# never load a file that has not passed check_config.
homeassistant_staging_dir: "{{ homeassistant_install_dir }}/config-staging"
# Files copied from the private config repo into /config — and the ONLY files
# Ansible ever writes there. Anything configuration.yaml includes must be
# listed, otherwise check_config fails on the missing include (by design).
homeassistant_config_files:
  - configuration.yaml
  - automations-managed.yaml
# Full image reference, digest-pinned. Assembled from the two group_vars inputs
# so the running container and the check_config validation can never use two
# different images.
homeassistant_image: "ghcr.io/home-assistant/home-assistant:{{ homeassistant_version }}@{{ homeassistant_image_digest }}"

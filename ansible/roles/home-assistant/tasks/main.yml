---
# Home Assistant LXC (107) — domotique. HA Container (the Supervisor-less
# install type) in Docker Compose inside its own LXC, same runtime pattern as
# immich/uptime (CLAUDE.md: no service on the PVE host).
#
# Decision 2026-10-18 (Container over HA OS): every device targeted at phase 1
# speaks IP — Thermor Allure 4 via the Overkiz cloud integration, Shelly over
# local Wi-Fi, the inverter and the wallbox over the LAN. None of them needs
# the Supervisor, an app or Matter/Thread. In exchange we keep the repo's
# pattern: pinned versions, Ansible-templated config, PBS, and direct
# filesystem access to /config from the terminal.

# Docker packaged in Debian trixie — no extra APT repo, same as immich/uptime.
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create Home Assistant install directory
  ansible.builtin.file:
    path: "{{ homeassistant_install_dir }}"
    state: directory
    mode: "0750"

# Created explicitly rather than letting Docker create it on first `up`: the
# config templates below must land here BEFORE HA's first start, otherwise HA
# generates its own default configuration.yaml and the first playbook run
# overwrites it on the next pass (confusing diff, two restarts).
- name: Create Home Assistant config directory
  ansible.builtin.file:
    path: "{{ homeassistant_install_dir }}/config"
    state: directory
    mode: "0750"

- name: Deploy Home Assistant docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homeassistant_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# Pulled BEFORE the config is touched: the validation step below runs
# check_config inside this exact image, so a version bump is validated against
# the schema of the version about to run, not the one currently running.
- name: Pull Home Assistant image
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ homeassistant_install_dir }}"
  changed_when: false

# --- Git-owned config: render → validate → swap in --------------------------
# Ansible owns configuration.yaml and automations-managed.yaml. It does NOT own
# .storage/ (integrations, entity registry, dashboards) — that is HA's internal
# JSON, UI-only on every install type.
#
# The templates are NOT rendered straight into config/. A YAML syntax error in
# either file stops configuration.yaml from loading and HA boots into recovery
# mode — every integration and automation stopped — while a plain
# template + restart would still report the play green. So both files are
# rendered into a staging directory, validated there, and copied into config/
# only once check_config passes. A rejected change never reaches HA.
- name: Create the config staging directory
  ansible.builtin.file:
    path: "{{ homeassistant_staging_dir }}"
    state: directory
    mode: "0750"

- name: Render configuration.yaml into staging
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: "{{ homeassistant_staging_dir }}/configuration.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render the Git-owned automations into staging
  ansible.builtin.template:
    src: automations-managed.yaml.j2
    dest: "{{ homeassistant_staging_dir }}/automations-managed.yaml"
    owner: root
    group: root
    mode: "0644"

# Measured against this exact image (2026.10.2), three cases:
#   - valid config                    → rc=0, no "ERROR:" line
#   - YAML syntax error               → rc=1   (the recovery-mode case)
#   - valid YAML, invalid automation  → rc=0 but one "ERROR:" line. HA would
#     silently disable that automation; --fail-on-warnings does not catch it
#     and the --json report counts 0 errors.
# Hence the double condition: the valid config produced zero "ERROR:" lines in
# the same measurement, so failing on any of them has no false positive.
# --network none: the check needs nothing from the network and must not reach
# it. --entrypoint python3: the image's default /init (s6) would start HA.
# :ro — check_config writes nothing into the directory it validates (measured).
- name: Validate the staged config with check_config
  ansible.builtin.command: >
    docker run --rm --network none
    --entrypoint python3
    -v {{ homeassistant_staging_dir }}:/config:ro
    {{ homeassistant_image }}
    -m homeassistant --script check_config --config /config
  register: ha_check_config
  changed_when: false
  failed_when: >
    ha_check_config.rc != 0
    or (ha_check_config.stdout_lines + ha_check_config.stderr_lines)
    | select('match', '^ERROR:') | list | length > 0

- name: Install the validated configuration.yaml
  ansible.builtin.copy:
    src: "{{ homeassistant_staging_dir }}/configuration.yaml"
    dest: "{{ homeassistant_install_dir }}/config/configuration.yaml"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart home assistant

- name: Install the validated Git-owned automations
  ansible.builtin.copy:
    src: "{{ homeassistant_staging_dir }}/automations-managed.yaml"
    dest: "{{ homeassistant_install_dir }}/config/automations-managed.yaml"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart home assistant

- name: Start Home Assistant
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ homeassistant_install_dir }}"
  register: ha_compose_up
  # Compose v2 writes container lifecycle status to stderr; check stdout too in
  # case a wrapper routes it differently.
  changed_when: >
    'Started' in (ha_compose_up.stderr + ha_compose_up.stdout)
    or 'Created' in (ha_compose_up.stderr + ha_compose_up.stdout)
    or 'Recreate' in (ha_compose_up.stderr + ha_compose_up.stdout)

# --- TLS reverse proxy (Caddy) — same pattern as immich/uptime ---
# Cert issued on the AdGuard LXC (acme.sh, DNS-01) and pushed to
# /etc/caddy/cert over SSH by the `home-assistant-cert` role.

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
    force: false

- name: Add Caddy APT repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/caddy-stable.list
    content: |
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    mode: "0644"

# Installing the package creates the `caddy` user/group — created BEFORE
# certdeploy so certdeploy's primary group can be caddy (cert files it writes
# are then caddy-readable without a post-write chgrp).
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Create certdeploy user (target of the acme.sh ssh deploy-hook)
  ansible.builtin.user:
    name: certdeploy
    system: true
    shell: /bin/bash
    group: caddy
    create_home: true
    state: present

- name: Create Caddy cert directory
  ansible.builtin.file:
    path: /etc/caddy/cert
    state: directory
    owner: certdeploy
    group: caddy
    mode: "0750"

# This Debian template doesn't ship sudo — needed for the certdeploy sudoers rule.
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present

# Public half of the keypair generated on adguard (playbook.yml adguard play).
# Skipped when adguard isn't in scope — run `--limit adguard,homeassistant`.
- name: Authorize the deploy key for certdeploy (source-restricted)
  ansible.posix.authorized_key:
    user: certdeploy
    state: present
    key: "{{ hostvars[groups['adguard'][0]]['homeassistant_cert_deploy_pubkey'] }}"
    key_options: 'from="{{ adguard_ip }}",no-pty,no-agent-forwarding,no-X11-forwarding,no-port-forwarding'
    exclusive: true
  when: hostvars[groups['adguard'][0]]['homeassistant_cert_deploy_pubkey'] is defined

- name: Grant certdeploy a one-command sudoers rule (restart Caddy only)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/certdeploy
    content: |
      certdeploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart caddy
    mode: "0440"
    validate: visudo -cf %s

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
  notify: Reload caddy

# Enabled so it comes up on boot; NOT started here — Caddy refuses to start
# while /etc/caddy/cert/*.pem are absent (fresh install, cert not yet pushed).
# The home-assistant-cert role's ssh deploy-hook runs `systemctl restart caddy`
# right after landing the cert, which starts it the first time.
- name: Enable Caddy service
  ansible.builtin.systemd:
    name: caddy
    enabled: true

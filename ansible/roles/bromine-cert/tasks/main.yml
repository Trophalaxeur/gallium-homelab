---
# Issues the Let's Encrypt cert for bromine.flefevre.fr ON THE ADGUARD LXC and
# pushes it to the bromine LXC over SSH via acme.sh's ssh deploy-hook. This
# keeps the Online.net DNS API key (which controls the whole flefevre.fr zone)
# on a single host — bromine never holds it. acme.sh + the LE account are
# already installed by the adguard-home role (which runs earlier), so this role
# only issues, configures the deploy-hook, and triggers the first push.
#
# On renewal, adguard's existing daily `acme.sh --cron` (adguard-home role)
# re-runs the saved deploy-hook automatically → re-push + reload Caddy on
# bromine. No cron or acme.sh install is needed on bromine.

# The deploy keypair (/root/.ssh/bromine-cert-deploy) is generated by the
# AdGuard play's post_tasks in playbook.yml — its private half is born and
# stays on this host, never in vault. The bromine play authorizes the matching
# public half on bromine's certdeploy user. So there is nothing to install here.

# Same issuance recipe as adguard-home's own cert, single-host (-d), EC-256,
# DNS-01 via Online.net. rc=2 = "not yet due for renewal" → treated as success.
- name: Issue certificate for {{ bromine_domain }}
  command: >
    /root/.acme.sh/acme.sh --issue
    -d {{ bromine_domain }}
    --dns dns_online
    --server letsencrypt
    --accountemail {{ acme_email }}
    --keylength ec-256
  environment:
    HOME: /root
    ONLINE_API_KEY: "{{ online_api_key }}"
  register: acme_issue_bromine
  failed_when: acme_issue_bromine.rc not in [0, 2]
  changed_when: acme_issue_bromine.rc == 0
  no_log: true
  args:
    creates: /root/.acme.sh/{{ bromine_domain }}_ecc/{{ bromine_domain }}.cer

# Configures AND runs the ssh deploy-hook. acme.sh persists these DEPLOY_SSH_*
# values into the domain's .conf, so `--cron` re-runs the push automatically on
# every future renewal. Run each play (changed_when: false) so bromine always
# ends up with the current cert — self-heals if the bromine LXC was rebuilt.
#   FULLCHAIN → Caddy's cert file (it wants the full chain), KEYFILE → key.
#   REMOTE_CMD tightens key.pem to 0640 (caddy-group-only, NOT app-readable)
#   after acme.sh writes it umask-default, then restarts Caddy (sudoers-allowed).
- name: Deploy certificate to bromine over SSH (and reload Caddy)
  command: /root/.acme.sh/acme.sh --deploy -d {{ bromine_domain }} --deploy-hook ssh
  environment:
    HOME: /root
    DEPLOY_SSH_USER: certdeploy
    DEPLOY_SSH_SERVER: "{{ bromine_ip }}"
    DEPLOY_SSH_CMD: ssh -i /root/.ssh/bromine-cert-deploy -o StrictHostKeyChecking=accept-new
    DEPLOY_SSH_FULLCHAIN: /etc/caddy/cert/cert.pem
    DEPLOY_SSH_KEYFILE: /etc/caddy/cert/key.pem
    DEPLOY_SSH_BACKUP: "no"
    DEPLOY_SSH_REMOTE_CMD: chmod 640 /etc/caddy/cert/key.pem && sudo systemctl restart caddy
  changed_when: false
  no_log: true

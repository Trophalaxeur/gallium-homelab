---
# Issues the Let's Encrypt cert for {{ homeassistant_domain }}
# (homeassistant.flefevre.fr) ON THE ADGUARD LXC and pushes it to the
# homeassistant LXC over SSH via acme.sh's ssh deploy-hook. Same rationale as
# immich-cert/uptime-cert: the Online.net DNS API key (controls the whole
# flefevre.fr zone) stays on a single host, homeassistant never holds it.
# acme.sh + the LE account are already installed by the adguard-home role.
#
# On renewal, adguard's existing daily `acme.sh --cron` (adguard-home role)
# re-runs the saved deploy-hook automatically → re-push + restart Caddy on
# homeassistant. No cron or acme.sh install is needed on homeassistant.

# The deploy keypair (/root/.ssh/homeassistant-cert-deploy) is generated by the
# AdGuard play's post_tasks in playbook.yml — its private half is born and stays
# on this host, never in vault. The homeassistant play authorizes the matching
# public half on its own certdeploy user. So there is nothing to install here.

# Same issuance recipe as immich/uptime: single-host (-d), EC-256, DNS-01 via
# Online.net. rc=2 = "not yet due for renewal" → success.
- name: Issue certificate for {{ homeassistant_domain }}
  ansible.builtin.command: >
    /root/.acme.sh/acme.sh --issue
    -d {{ homeassistant_domain }}
    --dns dns_online
    --server letsencrypt
    --accountemail {{ acme_email }}
    --keylength ec-256
  environment:
    HOME: /root
    ONLINE_API_KEY: "{{ online_api_key }}"
  register: acme_issue_homeassistant
  failed_when: acme_issue_homeassistant.rc not in [0, 2]
  changed_when: acme_issue_homeassistant.rc == 0
  no_log: true
  args:
    creates: /root/.acme.sh/{{ homeassistant_domain }}_ecc/{{ homeassistant_domain }}.cer

# Configures AND runs the ssh deploy-hook. acme.sh persists these DEPLOY_SSH_*
# values into the domain's .conf, so `--cron` re-runs the push automatically on
# every future renewal. Run each play (changed_when: false) so homeassistant
# always ends up with the current cert — self-heals if the LXC was rebuilt.
- name: Deploy certificate to homeassistant over SSH (and restart Caddy)
  ansible.builtin.command: /root/.acme.sh/acme.sh --deploy -d {{ homeassistant_domain }} --deploy-hook ssh
  environment:
    HOME: /root
    DEPLOY_SSH_USER: certdeploy
    DEPLOY_SSH_SERVER: "{{ homeassistant_ip }}"
    DEPLOY_SSH_CMD: ssh -i /root/.ssh/homeassistant-cert-deploy -o StrictHostKeyChecking=accept-new
    DEPLOY_SSH_FULLCHAIN: /etc/caddy/cert/cert.pem
    DEPLOY_SSH_KEYFILE: /etc/caddy/cert/key.pem
    DEPLOY_SSH_BACKUP: "no"
    DEPLOY_SSH_REMOTE_CMD: chmod 640 /etc/caddy/cert/key.pem && sudo systemctl restart caddy
  changed_when: false
  no_log: true

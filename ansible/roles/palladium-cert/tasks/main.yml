---
# Issues ONE Let's Encrypt cert covering every name palladium serves
# ({{ immich_share_domain }}, {{ homeassistant_domain }}, {{ immich_domain }})
# ON THE ADGUARD LXC and pushes it to palladium over SSH via acme.sh's ssh
# deploy-hook. Same rationale as the other *-cert roles: the Online.net DNS API
# key (controls the whole flefevre.fr zone) stays on a single host.
#
# This is a separate cert from the ones hassium and immich hold for their own
# names: acme.sh keys its storage on the FIRST -d, so share.flefevre.fr_ecc
# never collides with hassium.flefevre.fr_ecc or photos.flefevre.fr_ecc.
#
# On renewal, adguard's existing daily `acme.sh --cron` (adguard-home role)
# re-runs the saved deploy-hook automatically → re-push + restart Caddy on
# palladium.

# The deploy keypair (/root/.ssh/palladium-cert-deploy) is generated by the
# AdGuard play's post_tasks in playbook.yml — its private half is born and
# stays on this host, never in vault.

# Same issuance recipe as the other roles, multi-SAN. rc=2 = "not yet due for
# renewal" → success. `creates:` makes this a first-issue-only task: adding a
# name later needs a manual `--issue ... --force` with the full -d list.
- name: Issue certificate for palladium's names
  ansible.builtin.command: >
    /root/.acme.sh/acme.sh --issue
    -d {{ immich_share_domain }}
    -d {{ homeassistant_domain }}
    -d {{ immich_domain }}
    --dns dns_online
    --server letsencrypt
    --accountemail {{ acme_email }}
    --keylength ec-256
  environment:
    HOME: /root
    ONLINE_API_KEY: "{{ online_api_key }}"
  register: acme_issue_palladium
  failed_when: acme_issue_palladium.rc not in [0, 2]
  changed_when: acme_issue_palladium.changed and acme_issue_palladium.rc == 0
  no_log: true
  args:
    creates: /root/.acme.sh/{{ immich_share_domain }}_ecc/{{ immich_share_domain }}.cer

# Same host-key refresh as uptime-cert: a rebuilt palladium comes back with a
# fresh host key, which accept-new would refuse — silently, from acme.sh --cron.
- name: Refresh adguard's known host key for palladium
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ palladium_ip }}"
    # -q is load-bearing: see uptime-cert.
    key: "{{ lookup('pipe', 'ssh-keyscan -q -T 5 -t ed25519 ' + palladium_ip) }}"
    state: present

# Configures AND runs the ssh deploy-hook; acme.sh persists the DEPLOY_SSH_*
# values, so `--cron` re-runs the push on every renewal.
- name: Deploy certificate to palladium over SSH (and restart Caddy)
  ansible.builtin.command: /root/.acme.sh/acme.sh --deploy -d {{ immich_share_domain }} --deploy-hook ssh
  environment:
    HOME: /root
    DEPLOY_SSH_USER: certdeploy
    DEPLOY_SSH_SERVER: "{{ palladium_ip }}"
    DEPLOY_SSH_CMD: ssh -i /root/.ssh/palladium-cert-deploy -o StrictHostKeyChecking=accept-new
    DEPLOY_SSH_FULLCHAIN: /etc/caddy/cert/cert.pem
    DEPLOY_SSH_KEYFILE: /etc/caddy/cert/key.pem
    DEPLOY_SSH_BACKUP: "no"
    DEPLOY_SSH_REMOTE_CMD: chmod 640 /etc/caddy/cert/key.pem && sudo systemctl restart caddy
  changed_when: false
  no_log: true

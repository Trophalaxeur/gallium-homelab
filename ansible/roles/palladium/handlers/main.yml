---
# The packaged unit runs `caddy reload --force`, so this also re-reads the
# client CA and device certificates when only those files changed. That is the
# revocation path: a failed reload keeps the OLD config — revoked device still
# accepted — so it must fail the play, never be ignored.
#
# Skipped until the server certificate has been pushed: the Debian package
# starts Caddy with its stock config on install, and our config cannot load
# without /etc/caddy/cert (measured on the first deploy). The cert push
# (palladium-cert role) restarts Caddy, which then reads every current file.
# `state: reloaded` would also START a stopped unit, hence the running check.
- name: Check whether caddy is running
  ansible.builtin.service_facts:
  listen: Reload caddy

- name: Check whether the server certificate has been pushed
  ansible.builtin.stat:
    path: /etc/caddy/cert/cert.pem
  register: palladium_server_cert
  listen: Reload caddy

- name: Reload running caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
  when:
    - ansible_facts.services['caddy.service'].state == 'running'
    - palladium_server_cert.stat.exists
  listen: Reload caddy

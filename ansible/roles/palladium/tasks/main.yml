---
# palladium LXC (108) — the only internet-facing host. Caddy checks client
# certificates (mTLS) in front of hassium and immich, and serves Immich share
# links through immich-public-proxy (Docker Compose). Flows and procedures:
# docs/palladium.md.

# --- Client certificates (mTLS) — checked first: Caddy cannot start without them
# The client CA and the device certificates are PUBLIC halves, generated on
# thallium by scripts/mtls-client-cert.sh. The CA key never comes near this repo.
- name: Require the client CA and at least one device certificate
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.fileglob', 'client-ca.pem') | length > 0
      - query('ansible.builtin.fileglob', 'client-certs/*.pem') | length > 0
    fail_msg: >-
      roles/palladium/files/client-ca.pem or files/client-certs/*.pem is
      missing. Create them with scripts/mtls-client-cert.sh (docs/palladium.md)
      — without them Caddy would refuse every connection.
    quiet: true

# Docker packaged in Debian trixie — no extra APT repo, same as immich/uptime.
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create immich-public-proxy install directory
  ansible.builtin.file:
    path: "{{ palladium_install_dir }}"
    state: directory
    mode: "0750"

- name: Deploy immich-public-proxy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ palladium_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Pull immich-public-proxy image
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ palladium_install_dir }}"
  changed_when: false

- name: Start immich-public-proxy
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ palladium_install_dir }}"
  register: palladium_compose_up
  # Compose v2 writes container lifecycle status to stderr; check stdout too in
  # case a wrapper routes it differently.
  changed_when: >
    'Started' in (palladium_compose_up.stderr + palladium_compose_up.stdout)
    or 'Created' in (palladium_compose_up.stderr + palladium_compose_up.stdout)
    or 'Recreate' in (palladium_compose_up.stderr + palladium_compose_up.stdout)

# --- TLS reverse proxy (Caddy) — same pattern as immich/uptime/hassium ---
# Cert issued on the AdGuard LXC (acme.sh, DNS-01) and pushed to
# /etc/caddy/cert over SSH by the `palladium-cert` role.

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
    force: false

- name: Add Caddy APT repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/caddy-stable.list
    content: |
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    mode: "0644"

# Installing the package creates the `caddy` user/group — created BEFORE
# certdeploy so certdeploy's primary group can be caddy.
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

# --- Security updates — the only internet-facing host must patch itself ---
# Debian's stock 50unattended-upgrades already allows the Debian-Security
# origins; the extra file adds the Caddy repo (origin taken from its Release
# file). immich-public-proxy is a pinned image: bumped by hand (vars.yml).
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable the daily unattended upgrade run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Allow unattended upgrades from the Caddy repo
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-caddy
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=cloudsmith/caddy/stable";
      };
    mode: "0644"

- name: Create certdeploy user (target of the acme.sh ssh deploy-hook)
  ansible.builtin.user:
    name: certdeploy
    system: true
    shell: /bin/bash
    group: caddy
    create_home: true
    state: present

- name: Create Caddy cert directory
  ansible.builtin.file:
    path: /etc/caddy/cert
    state: directory
    owner: certdeploy
    group: caddy
    mode: "0750"

# This Debian template doesn't ship sudo — needed for the certdeploy sudoers rule.
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present

# Public half of the keypair generated on adguard (playbook.yml adguard play).
# Skipped when adguard isn't in scope — run `--limit adguard,palladium` to sync.
- name: Authorize the deploy key for certdeploy (source-restricted)
  ansible.posix.authorized_key:
    user: certdeploy
    state: present
    key: "{{ hostvars[groups['adguard'][0]]['palladium_cert_deploy_pubkey'] }}"
    key_options: 'from="{{ adguard_ip }}",no-pty,no-agent-forwarding,no-X11-forwarding,no-port-forwarding'
    exclusive: true
  when: hostvars[groups['adguard'][0]]['palladium_cert_deploy_pubkey'] is defined

- name: Grant certdeploy a one-command sudoers rule (restart Caddy only)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/certdeploy
    content: |
      certdeploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart caddy
    mode: "0440"
    validate: visudo -cf %s

- name: Create the mTLS directory
  ansible.builtin.file:
    path: "{{ palladium_mtls_dir }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"

- name: Deploy the client CA certificate
  ansible.builtin.copy:
    src: client-ca.pem
    dest: "{{ palladium_mtls_dir }}/client-ca.pem"
    owner: root
    group: caddy
    mode: "0640"
  notify: Reload caddy

# One bundle rather than a copied directory: deleting a device's .pem from the
# repo then removes it here too on the next play — that is the revocation path.
- name: Deploy the allowed device certificates
  ansible.builtin.copy:
    content: |
      {% for cert in query('ansible.builtin.fileglob', 'client-certs/*.pem') | sort %}
      {{ lookup('ansible.builtin.file', cert) }}
      {% endfor %}
    dest: "{{ palladium_mtls_dir }}/client-certs.pem"
    owner: root
    group: caddy
    mode: "0640"
  notify: Reload caddy

# `adapt`, not `validate`: it parses the Caddyfile (snippets, client_auth
# subdirectives) without loading the certificates, which are still absent on a
# fresh install. A typo here would otherwise only surface as a failed reload,
# and the handler ignores that.
- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: caddy adapt --adapter caddyfile --config %s
  notify: Reload caddy

# Enabled so it comes up on boot; NOT started here — Caddy refuses to start
# while /etc/caddy/cert/*.pem are absent (fresh install, cert not yet pushed).
# The palladium-cert role's ssh deploy-hook runs `systemctl restart caddy`
# right after landing the cert, which starts it the first time.
- name: Enable Caddy service
  ansible.builtin.systemd:
    name: caddy
    enabled: true

---
# Repos that need a GitHub deploy key on the bromine LXC.
# carbon-notes needs read+write (tailored CV content commits); bismuth-blog
# and bromine-backend are read-only (bismuth-blog is cloned only to render
# PDFs via astro dev + Playwright; bromine-backend is the code running on
# the box, not content it reads/writes).
deploy_key_repos:
  - carbon-notes
  - bismuth-blog
  - bromine-backend

deploy_key_repos_write:
  - carbon-notes

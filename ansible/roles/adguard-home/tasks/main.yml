---
- name: Install dependencies
  ansible.builtin.apt:
    name: [curl, git, tar, socat, openssl, cron, logrotate]
    state: present
    update_cache: true

- name: Create AdGuard Home directory
  ansible.builtin.file:
    path: /opt/AdGuardHome
    state: directory
    mode: "0755"

- name: Download AdGuard Home
  ansible.builtin.get_url:
    url: "https://static.adguard.com/adguardhome/release/AdGuardHome_linux_amd64.tar.gz"
    dest: /tmp/adguard-home.tar.gz
    mode: "0644"

- name: Extract AdGuard Home binary
  ansible.builtin.unarchive:
    src: /tmp/adguard-home.tar.gz
    dest: /tmp
    remote_src: true

- name: Install binary
  ansible.builtin.copy:
    src: /tmp/AdGuardHome/AdGuardHome
    dest: /opt/AdGuardHome/AdGuardHome
    mode: "0755"
    remote_src: true

# Certificates are provisioned BEFORE deploying config + starting service,
# so AdGuard finds valid TLS material on first start (no degraded HTTP-only run).
- name: Create cert directory
  ansible.builtin.file:
    path: /opt/AdGuardHome/cert
    state: directory
    mode: "0750"

- name: Clone acme.sh (pinned)
  ansible.builtin.git:
    repo: https://github.com/acmesh-official/acme.sh.git
    dest: /tmp/acme.sh-src
    version: "3.1.3"
    force: false

# --nocron prevents acme.sh from installing its own cron entry.
# We manage renewal scheduling explicitly via Ansible (below) for visibility.
- name: Install acme.sh from source
  ansible.builtin.command: ./acme.sh --install --home /root/.acme.sh --nocron
  args:
    chdir: /tmp/acme.sh-src
    creates: /root/.acme.sh/acme.sh
  environment:
    HOME: /root

- name: Register acme.sh account email
  ansible.builtin.command: /root/.acme.sh/acme.sh --register-account -m {{ acme_email }} --server letsencrypt
  environment:
    HOME: /root
  args:
    creates: /root/.acme.sh/ca/acme-v02.api.letsencrypt.org/directory/account.json

- name: Issue certificate for {{ adguard_domain }}
  ansible.builtin.command: >
    /root/.acme.sh/acme.sh --issue
    -d {{ adguard_domain }}
    --dns dns_online
    --server letsencrypt
    --accountemail {{ acme_email }}
    --keylength ec-256
  environment:
    HOME: /root
    ONLINE_API_KEY: "{{ online_api_key }}"
  register: acme_issue
  failed_when: acme_issue.rc not in [0, 2]
  # A creates: skip returns rc=0 with changed=False — keep the module's verdict.
  changed_when: acme_issue.changed and acme_issue.rc == 0
  no_log: true
  args:
    creates: /root/.acme.sh/{{ adguard_domain }}_ecc/{{ adguard_domain }}.cer

- name: Check for an existing AdGuard configuration
  ansible.builtin.stat:
    path: /opt/AdGuardHome/AdGuardHome.yaml
  register: adguard_config_stat

- name: Deploy initial AdGuard configuration
  ansible.builtin.template:
    src: adguard-home.yaml.j2
    dest: /opt/AdGuardHome/AdGuardHome.yaml
    mode: "0600"
  when: not adguard_config_stat.stat.exists
  no_log: true   # embeds adguard_admin_password_hash
  notify: Restart adguardhome

# AdGuard rewrites its config on startup with every default key, so the template
# is merged into the live file and compared as data, never as text. Known limit:
# a scalar removed from the template stays in the live file (lists are replaced
# whole). schema_version is owned by AdGuard once installed. See docs/adguard-config.md.
- name: Merge AdGuard configuration into the live file
  when: adguard_config_stat.stat.exists
  no_log: true   # embeds adguard_admin_password_hash
  block:
    - name: Read live AdGuard configuration
      ansible.builtin.slurp:
        src: /opt/AdGuardHome/AdGuardHome.yaml
      register: adguard_config_slurp

    - name: Compute desired AdGuard configuration
      ansible.builtin.set_fact:
        adguard_config_live: "{{ adguard_config_live_parsed }}"
        adguard_config_desired: >-
          {{ adguard_config_live_parsed
             | combine(lookup('template', 'adguard-home.yaml.j2') | from_yaml,
                       recursive=True, list_merge='replace')
             | combine({'schema_version': adguard_config_live_parsed.schema_version}) }}
      vars:
        adguard_config_live_parsed: "{{ adguard_config_slurp.content | b64decode | from_yaml }}"

    - name: Deploy AdGuard configuration
      ansible.builtin.copy:
        content: "{{ adguard_config_desired | to_nice_yaml(indent=2) }}"
        dest: /opt/AdGuardHome/AdGuardHome.yaml
        mode: "0600"
      when: adguard_config_desired != adguard_config_live
      notify: Restart adguardhome

- name: Install AdGuard Home as systemd service
  ansible.builtin.command: /opt/AdGuardHome/AdGuardHome -s install
  args:
    creates: /etc/systemd/system/AdGuardHome.service

# Cert install runs the reloadcmd (systemctl restart) — this is what starts
# AdGuard for the first time, with valid cert files already in place.
- name: Install certificate to AdGuard cert directory
  ansible.builtin.command: >
    /root/.acme.sh/acme.sh --install-cert
    --ecc
    -d {{ adguard_domain }}
    --fullchain-file /opt/AdGuardHome/cert/cert.pem
    --key-file /opt/AdGuardHome/cert/key.pem
    --reloadcmd "systemctl restart AdGuardHome"
  environment:
    HOME: /root
  args:
    creates: /opt/AdGuardHome/cert/cert.pem

- name: Ensure AdGuard Home is started and enabled
  ansible.builtin.systemd:
    name: AdGuardHome
    state: started
    enabled: true
    daemon_reload: true

# Log to /var/log so renewal failures are observable; rotated by logrotate task below.
- name: Set up acme.sh cron for auto-renewal
  ansible.builtin.cron:
    name: "acme.sh renewal"
    minute: "0"
    hour: "0"
    job: 'HOME=/root /root/.acme.sh/acme.sh --cron --home /root/.acme.sh >> /var/log/acme-renewal.log 2>&1'

- name: Configure logrotate for acme.sh renewal log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/acme-renewal
    content: |
      /var/log/acme-renewal.log {
        monthly
        rotate 6
        compress
        missingok
        notifempty
        create 0640 root adm
      }
    mode: "0644"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

---
# Docker packaged in Debian trixie — no extra APT repo, consistent with the
# rest of this homelab's "no over-engineering" stance (cf. CLAUDE.md).
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create Immich install directory
  ansible.builtin.file:
    path: "{{ immich_install_dir }}"
    state: directory
    mode: "0750"

# rootfs — covered by PBS as a fallback only; the pg_dumpall logical dump
# written to the photos dataset (UPLOAD_LOCATION/backups) is the source of
# truth for restore (cf. backup-strategy.md, "Base Immich").
- name: Create Postgres data directory
  ansible.builtin.file:
    path: "{{ immich_db_data_location }}"
    state: directory
    mode: "0700"

- name: Deploy Immich .env
  ansible.builtin.template:
    src: immich.env.j2
    dest: "{{ immich_install_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true   # renders vault_immich_db_password

- name: Deploy Immich docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Pull Immich images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ immich_install_dir }}"
  changed_when: false

- name: Start Immich stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ immich_install_dir }}"
  register: immich_compose_up
  changed_when: >
    'Started' in immich_compose_up.stderr or 'Created' in immich_compose_up.stderr
    or 'Recreate' in immich_compose_up.stderr

# --- TLS reverse proxy (Caddy) — same pattern as bromine (bromine-agent role) ---
# The cert itself is issued on the AdGuard LXC (acme.sh, DNS-01) and pushed to
# /etc/caddy/cert over SSH by the `immich-cert` role. See docs/bromine.md for
# the mechanism this mirrors.

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
    force: false

- name: Add Caddy APT repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/caddy-stable.list
    content: |
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    mode: "0644"

# Caddy's packaged systemd unit runs as `caddy` with
# AmbientCapabilities=CAP_NET_BIND_SERVICE, so it binds :443 without touching
# the Docker-published loopback port. Installing the package creates the
# `caddy` user/group — created here BEFORE certdeploy so certdeploy's primary
# group can be caddy.
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Create certdeploy user (target of the acme.sh ssh deploy-hook)
  ansible.builtin.user:
    name: certdeploy
    system: true
    shell: /bin/bash
    group: caddy
    create_home: true
    state: present

- name: Create Caddy cert directory
  ansible.builtin.file:
    path: /etc/caddy/cert
    state: directory
    owner: certdeploy
    group: caddy
    mode: "0750"

# Unlike bromine's LXC, this Debian template doesn't have sudo preinstalled —
# no /etc/sudoers.d without it, which the sudoers.d/certdeploy task below needs.
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present

# Public half of the keypair generated on adguard (playbook.yml adguard play).
# Skipped when adguard isn't in scope — run `--limit adguard,immich` to sync.
- name: Authorize the deploy key for certdeploy (source-restricted)
  ansible.posix.authorized_key:
    user: certdeploy
    state: present
    key: "{{ hostvars[groups['adguard'][0]]['immich_cert_deploy_pubkey'] }}"
    key_options: 'from="{{ adguard_ip }}",no-pty,no-agent-forwarding,no-X11-forwarding,no-port-forwarding'
    exclusive: true
  when: hostvars[groups['adguard'][0]]['immich_cert_deploy_pubkey'] is defined

- name: Grant certdeploy a one-command sudoers rule (reload Caddy only)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/certdeploy
    content: |
      certdeploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart caddy
    mode: "0440"
    validate: visudo -cf %s

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
  notify: Reload caddy

# Enabled so it comes up on boot; NOT started here — Caddy refuses to start
# while /etc/caddy/cert/*.pem are absent (fresh install, cert not yet pushed).
# The immich-cert role's ssh deploy-hook runs `systemctl restart caddy` right
# after landing the cert, which starts it the first time.
- name: Enable Caddy service
  ansible.builtin.systemd:
    name: caddy
    enabled: true

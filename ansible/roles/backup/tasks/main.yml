---
# backup LXC (105) — runs the isolated data-protection jobs (Étape 4 of
# ~/.claude/plans/backup-strategy.md): rclone → Scaleway, weekly Object Lock
# renewal, rclone → HDD. Deliberately holds the ONLY writable HDD mount and the
# ONLY copy of the Scaleway IAM key in the homelab: a compromise of Immich
# (the real attack surface) reaches neither (Scénario 6 isolation).

# Step 1 — packages
# python3-boto3: drives the weekly Object Lock renewal — rclone cannot extend
# Object Lock retention on existing objects. awscli is kept for manual ops on
# the bucket only; the renewal job no longer shells out to it (see Step 5).
# rclone: the copy engine. msmtp/mailutils: abort/alert mail, same pattern as
# neon/bromine.
- name: Install packages
  apt:
    name:
      - rclone
      - awscli
      - python3-boto3
      - cron
      - curl
      - logrotate
      - msmtp
      - mailutils
    state: present
    update_cache: true

# Step 2 — msmtp (mail on abort; shared vault_smtp_password like neon/bromine)
- name: Deploy msmtp config
  template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: "0600"
  no_log: true   # renders vault_smtp_password

- name: Ensure msmtp log file exists
  file:
    path: /var/log/msmtp.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Set sendmail symlink to msmtp
  file:
    src: /usr/bin/msmtp
    dest: /usr/sbin/sendmail
    state: link
    force: true

# Step 3 — verify the bind-mounts posted by terraform/backup.tf are correct.
# These are the load-bearing security assumptions of the whole isolation model,
# so assert them at deploy time rather than trust the Terraform ran cleanly.

# The immich-photos mount MUST be present AND read-only. findmnt fails (rc != 0)
# when the path is not a mountpoint at all — catching the case where the bind-
# mount is missing entirely, which a plain `touch` probe would wrongly accept
# (ENOENT and EROFS both return non-zero). We then require `ro` in the options:
# a missing ro=1 means the backup jobs could mutate the source of truth.
- name: Assert the immich-photos mount is present and read-only
  ansible.builtin.command: findmnt --noheadings --output OPTIONS {{ backup_photos_src }}
  register: photos_mnt
  changed_when: false
  failed_when: photos_mnt.rc != 0 or 'ro' not in photos_mnt.stdout.split(',')
  # rc != 0 → not mounted (missing bind-mount); 'ro' absent → not read-only.

- name: Assert the HDD bind-mount is actually mounted (not an empty dir)
  ansible.builtin.command: mountpoint -q {{ backup_hdd_mount }}
  changed_when: false
  # Fails if /mnt/hdd is a plain directory → the HDD passthrough is missing.
  # Same failure the runtime job guards against (Scénario 8), checked early.

# Step 4 — rclone remote for Scaleway (S3-compatible). Creds from vault, never
# in the repo. This file is the crown jewel this LXC isolates from Immich.
- name: Create rclone config directory
  file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy rclone config (Scaleway remote)
  template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true   # renders the Scaleway secret key

# awscli reads the same Scaleway key for the Object Lock renewal job.
- name: Create aws credentials directory
  file:
    path: /root/.aws
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy aws credentials (Scaleway, for object-lock renewal)
  template:
    src: aws-credentials.j2
    dest: /root/.aws/credentials
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Step 5 — the three job scripts. The renewal one is Python (boto3): forking an
# `aws` process per object made it interpreter-startup-bound (~8h30 for 77k
# objects); one process with a thread pool pays the import once.
- name: Deploy backup job scripts
  template:
    src: "{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - backup-rclone-scaleway.sh
    - backup-object-lock-renew.py
    - backup-rclone-hdd.sh
  no_log: true   # scripts embed vault values (Healthchecks UUIDs) — no --diff leak

- name: Remove the superseded shell version of the renewal job
  file:
    path: /usr/local/bin/backup-object-lock-renew.sh
    state: absent

# Step 6 — crons: Scaleway 02:00, HDD 02:20 (after the DB dump lands), Object
# Lock renewal Sunday 03:00. Timings chosen so the nightly chain doesn't overlap.
- name: Deploy backup cron jobs
  template:
    src: cron-backup.j2
    dest: /etc/cron.d/backup-jobs
    owner: root
    group: root
    mode: "0644"

- name: Deploy logrotate config for backup job logs
  template:
    src: logrotate-backup.j2
    dest: /etc/logrotate.d/backup
    owner: root
    group: root
    mode: "0644"

---
# backup LXC (105) — runs the isolated data-protection jobs (Étape 4 of
# ~/.claude/plans/backup-strategy.md): rclone → Scaleway, weekly Object Lock
# renewal, rclone → HDD. Deliberately holds the ONLY writable HDD mount and the
# ONLY copy of the Scaleway IAM key in the homelab: a compromise of Immich
# (the real attack surface) reaches neither (Scénario 6 isolation).

# Step 1 — packages
# python3-boto3: drives the weekly Object Lock renewal (put-object-retention) —
# rclone cannot extend retention on existing objects. unzip: rclone's release
# archive (rclone itself is the pinned upstream binary below, not Debian's).
# msmtp/mailutils: abort/alert mail, same pattern as neon.
- name: Install packages
  ansible.builtin.apt:
    name:
      - unzip
      - python3-boto3
      - cron
      - curl
      - logrotate
      - msmtp
      - mailutils
    state: present
    update_cache: true

# Step 1b — rclone, upstream binary pinned by version + sha256 (same pattern as
# the AdGuard binary). Debian's package is removed so there is exactly one
# rclone; the cron PATH (cron-backup.j2) starts with /usr/local/bin anyway.
- name: Remove the Debian rclone package
  ansible.builtin.apt:
    name: rclone
    state: absent

# Read-only, so it also runs under --check. A missing binary reads as empty.
# Output's first line looks like "rclone v1.76.0".
- name: Read the installed rclone version
  ansible.builtin.command: /usr/local/bin/rclone version
  register: backup_rclone_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the pinned rclone binary
  when: >-
    ((backup_rclone_installed.stdout | default('')).split('\n') | first).split(' ') | last
    != rclone_version
  block:
    - name: Download rclone {{ rclone_version }}
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/{{ rclone_version }}/rclone-{{ rclone_version }}-linux-amd64.zip"
        dest: "/tmp/rclone-{{ rclone_version }}.zip"
        checksum: "sha256:{{ rclone_sha256 }}"
        mode: "0644"

    - name: Extract rclone
      ansible.builtin.unarchive:
        src: "/tmp/rclone-{{ rclone_version }}.zip"
        dest: /tmp
        remote_src: true
      when: not ansible_check_mode

    # copy writes a temp file then renames: safe even mid-job.
    - name: Install binary
      ansible.builtin.copy:
        src: "/tmp/rclone-{{ rclone_version }}-linux-amd64/rclone"
        dest: /usr/local/bin/rclone
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      when: not ansible_check_mode

# Step 2 — msmtp (mail on abort; shared vault_smtp_password like neon)
- name: Deploy msmtp config
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: "0600"
  no_log: true   # renders vault_smtp_password

- name: Ensure msmtp log file exists
  ansible.builtin.file:
    path: /var/log/msmtp.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Set sendmail symlink to msmtp
  ansible.builtin.file:
    src: /usr/bin/msmtp
    dest: /usr/sbin/sendmail
    state: link
    force: true

# Step 3 — verify the bind-mounts posted by terraform/backup.tf are correct.
# These are the load-bearing security assumptions of the whole isolation model,
# so assert them at deploy time rather than trust the Terraform ran cleanly.

# The immich-photos mount MUST be present AND read-only. findmnt fails (rc != 0)
# when the path is not a mountpoint at all — catching the case where the bind-
# mount is missing entirely, which a plain `touch` probe would wrongly accept
# (ENOENT and EROFS both return non-zero). We then require `ro` in the options:
# a missing ro=1 means the backup jobs could mutate the source of truth.
- name: Assert the immich-photos mount is present and read-only
  ansible.builtin.command: findmnt --noheadings --output OPTIONS {{ backup_photos_src }}
  register: backup_photos_mnt
  changed_when: false
  check_mode: false   # read-only assert: must also hold under --check
  failed_when: backup_photos_mnt.rc != 0 or 'ro' not in backup_photos_mnt.stdout.split(',')
  # rc != 0 → not mounted (missing bind-mount); 'ro' absent → not read-only.

# Same contract for Home Assistant's backups: present, and read-only.
- name: Assert the hassium-backups mount is present and read-only
  ansible.builtin.command: findmnt --noheadings --output OPTIONS {{ backup_hassium_src }}
  register: backup_hassium_mnt
  changed_when: false
  check_mode: false
  failed_when: backup_hassium_mnt.rc != 0 or 'ro' not in backup_hassium_mnt.stdout.split(',')

- name: Assert the HDD bind-mount is actually mounted (not an empty dir)
  ansible.builtin.command: mountpoint -q {{ backup_hdd_mount }}
  changed_when: false
  check_mode: false
  # Fails if /mnt/hdd is a plain directory → the HDD passthrough is missing.
  # Same failure the runtime job guards against (Scénario 8), checked early.

# Step 4 — rclone remote for Scaleway (S3-compatible). Creds from vault, never
# in the repo. This file is the crown jewel this LXC isolates from Immich.
- name: Create rclone config directory
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy rclone config (Scaleway remote)
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true   # renders the Scaleway secret key

# boto3 reads the same Scaleway key for the Object Lock renewal job.
- name: Create aws credentials directory
  ansible.builtin.file:
    path: /root/.aws
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy aws credentials (Scaleway, for object-lock renewal)
  ansible.builtin.template:
    src: aws-credentials.j2
    dest: /root/.aws/credentials
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Step 5 — the three job scripts
- name: Deploy backup job scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    # 0700, not 0755: these embed the vault-derived Kuma push tokens and every
    # cron entry runs as root, so nothing else needs to read them.
    mode: "0700"
  loop:
    - backup-rclone-scaleway.sh
    - backup-object-lock-renew.py
    - backup-rclone-hdd.sh
  no_log: true   # scripts embed vault values (Healthchecks UUIDs) — no --diff leak

# The .py superseded the shell version in PR #20; the old file is still on disk
# on LXCs provisioned before that. Cron already points at the .py — this only
# clears the stale copy (which still holds a readable push token).
- name: Remove the superseded shell version of the renewal job
  ansible.builtin.file:
    path: /usr/local/bin/backup-object-lock-renew.sh
    state: absent

# Step 6 — crons: Scaleway 02:00, HDD 02:20 (after the DB dump lands), Object
# Lock renewal Sunday 03:00. Timings chosen so the nightly chain doesn't overlap.
- name: Deploy backup cron jobs
  ansible.builtin.template:
    src: cron-backup.j2
    dest: /etc/cron.d/backup-jobs
    owner: root
    group: root
    mode: "0644"

- name: Deploy logrotate config for backup job logs
  ansible.builtin.template:
    src: logrotate-backup.j2
    dest: /etc/logrotate.d/backup
    owner: root
    group: root
    mode: "0644"

---
# Issues the Let's Encrypt cert for {{ uptime_domain }} (uptime.flefevre.fr) ON
# THE ADGUARD LXC and pushes it to the uptime LXC over SSH via acme.sh's ssh
# deploy-hook. Same rationale as immich-cert: the Online.net DNS
# API key (controls the whole flefevre.fr zone) stays on a single host, uptime
# never holds it. acme.sh + the LE account are already installed by the
# adguard-home role.
#
# On renewal, adguard's existing daily `acme.sh --cron` (adguard-home role)
# re-runs the saved deploy-hook automatically → re-push + reload Caddy on
# uptime. No cron or acme.sh install is needed on uptime.

# The deploy keypair (/root/.ssh/uptime-cert-deploy) is generated by the AdGuard
# play's post_tasks in playbook.yml — its private half is born and stays on this
# host, never in vault. The uptime play authorizes the matching public half on
# uptime's certdeploy user. So there is nothing to install here.

# Same issuance recipe as immich: single-host (-d), EC-256, DNS-01 via
# Online.net. rc=2 = "not yet due for renewal" → success.
- name: Issue certificate for {{ uptime_domain }}
  command: >
    /root/.acme.sh/acme.sh --issue
    -d {{ uptime_domain }}
    --dns dns_online
    --server letsencrypt
    --accountemail {{ acme_email }}
    --keylength ec-256
  environment:
    HOME: /root
    ONLINE_API_KEY: "{{ online_api_key }}"
  register: acme_issue_uptime
  failed_when: acme_issue_uptime.rc not in [0, 2]
  changed_when: acme_issue_uptime.rc == 0
  no_log: true
  args:
    creates: /root/.acme.sh/{{ uptime_domain }}_ecc/{{ uptime_domain }}.cer

# accept-new (DEPLOY_SSH_CMD below) trusts an UNKNOWN host key but refuses a
# CHANGED one — "will not permit connections to hosts with changed host keys",
# ssh_config(5). When Terraform recreates the uptime LXC (any ForceNew
# attribute: template, datastore...), it comes back on the same IP with a fresh
# host key and every push from here is refused. Silently, too: renewals run from
# acme.sh --cron, so nothing surfaces until the certificate expires.
# Refreshing adguard's entry for the target on every play closes that gap. The
# module also finds and replaces the hashed entries Debian writes by default
# (HashKnownHosts yes). Trust model: the key is trusted as scanned on the LAN —
# the same TOFU stance as the thallium-side "Accept host key" pre_tasks.
- name: Refresh adguard's known host key for uptime
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ uptime_ip }}"
    # -q is load-bearing: OpenSSH 10's ssh-keyscan prints a "# host:22 SSH-2.0-…"
    # banner on STDOUT before the key. Without -q that comment reaches `key`,
    # the module cannot match the host, leaves the stale key in place and
    # appends two lines on every play (measured: not idempotent, file grows).
    key: "{{ lookup('pipe', 'ssh-keyscan -q -T 5 -t ed25519 ' + uptime_ip) }}"
    state: present

# Configures AND runs the ssh deploy-hook. acme.sh persists these DEPLOY_SSH_*
# values into the domain's .conf, so `--cron` re-runs the push automatically on
# every future renewal. Run on each play (changed_when: false) so uptime always
# ends up with the current cert — including after its LXC is rebuilt, now that
# the task above keeps the host key current.
- name: Deploy certificate to uptime over SSH (and reload Caddy)
  command: /root/.acme.sh/acme.sh --deploy -d {{ uptime_domain }} --deploy-hook ssh
  environment:
    HOME: /root
    DEPLOY_SSH_USER: certdeploy
    DEPLOY_SSH_SERVER: "{{ uptime_ip }}"
    DEPLOY_SSH_CMD: ssh -i /root/.ssh/uptime-cert-deploy -o StrictHostKeyChecking=accept-new
    DEPLOY_SSH_FULLCHAIN: /etc/caddy/cert/cert.pem
    DEPLOY_SSH_KEYFILE: /etc/caddy/cert/key.pem
    DEPLOY_SSH_BACKUP: "no"
    DEPLOY_SSH_REMOTE_CMD: chmod 640 /etc/caddy/cert/key.pem && sudo systemctl restart caddy
  changed_when: false
  no_log: true

# --- immich ---
# ZFS dataset for photos + Immich's own DB dumps (backup=no equivalent — not a
# container rootfs, excluded from PBS by nature). Shared by the "Provision ZFS
# dataset" play, the zfs-maintenance sanoid template, and the immich LXC's
# Terraform mount_point (terraform/immich.tf) — single source of truth.
immich_photos_dataset: "rpool/data/immich-photos"
immich_admin_email: "admin@flefevre.fr"
# Public-facing name (registered at Online.net → 90.76.179.86, port-forwarded
# on the Livebox). immich.lan stays the internal/technical AdGuard name
# (matches the LXC hostname, like adguard.lan/bromine.lan/pbs.lan) — only the
# public domain changed, decision 2026-07-07.
immich_domain: "photos.flefevre.fr"
immich_version: "v3.0.1"
smtp_from_immich: "immich@flefevre.fr"

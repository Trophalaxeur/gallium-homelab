---
proxmox_node: "gallium"
proxmox_ip: "192.168.1.32"
adguard_ip: "192.168.1.53"
thallium_ip: "192.168.1.20"
neon_ip: "192.168.1.60"
pbs_ip: "192.168.1.62"
immich_ip: "192.168.1.63"
printer_ip: "192.168.1.29"       # Brother printer, DHCP-reserved on Livebox (MAC 48:45:E6:53:DE:D9)
adguard_admin_user: "admin"
adguard_domain: "adguard.flefevre.fr"
acme_email: "admin@flefevre.fr"

# --- neon ---
smtp_host: "smtp.gmail.com"
smtp_port: 587
smtp_user: "me@flefevre.fr"
smtp_from: "neon@flefevre.fr"
neon_admin_email: "admin@flefevre.fr"
# Admin SSH public key — used by Ansible to authorize neonuser (Terraform handles root)
ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpw+OdkwiB/HsgN7V3Vj/FNQI+tX7HsjNAPltIWdXTp flefevre@thallium"

# --- immich ---
# ZFS dataset for photos + Immich's own DB dumps (backup=no equivalent — not a
# container rootfs, excluded from PBS by nature). Shared by the "Provision ZFS
# dataset" play, the zfs-maintenance sanoid template, and the immich LXC's
# Terraform mount_point (terraform/immich.tf) — single source of truth.
immich_photos_dataset: "rpool/data/immich-photos"
immich_admin_email: "admin@flefevre.fr"
# Public-facing name (registered at Online.net → 90.76.179.86, port-forwarded
# on the Livebox). immich.lan stays the internal/technical AdGuard name
# (matches the LXC hostname, like adguard.lan/neon.lan/pbs.lan) — only the
# public domain changed, decision 2026-07-07.
immich_domain: "photos.flefevre.fr"
immich_version: "v3.3.5"
smtp_from_immich: "immich@flefevre.fr"

# --- backup ---
# Isolated LXC (105) that runs the rclone/HDD/object-lock jobs — never Immich
# itself (Scénario 6 isolation, ~/.claude/plans/backup-strategy.md).
backup_ip: "192.168.1.64"
backup_admin_email: "admin@flefevre.fr"
smtp_from_backup: "backup@flefevre.fr"

# Bind-mount paths INSIDE the backup LXC (posted by terraform/backup.tf):
#   immich photos, READ-ONLY  ·  hassium backups, READ-ONLY  ·
#   external HDD, writable (3rd physical copy)
backup_photos_src: "/mnt/immich-photos"
backup_hassium_src: "/mnt/hassium-backups"
backup_hdd_mount: "/mnt/hdd"
# HDD mount point on the Proxmox HOST (fstab, Étape 0-bis). Chowned to the
# backup LXC's mapped root (100000) so the unprivileged LXC can write to it —
# same fix as the immich-photos dataset (see the proxmox play in playbook.yml).
backup_hdd_host_mount: "/mnt/hdd-external"

# Scaleway Object Storage (bucket bootstrapped by
# scripts/scaleway-bucket-bootstrap.sh — Object Lock Compliance + SSE-ONE).
# ⚠️ scaleway_region MUST match SCW_REGION in scripts/.scaleway-credentials.env.
scaleway_bucket: "homelab-photos-backup"
scaleway_region: "fr-par"
scaleway_endpoint: "https://s3.fr-par.scw.cloud"
# rclone remote name written into /root/.config/rclone/rclone.conf
rclone_remote: "scaleway"
# Object Lock Compliance window (days) re-applied on every upload and renewed
# weekly on still-present library/ objects (Rétention glissante).
object_lock_days: 90

# Deadman switches → self-hosted Uptime Kuma (LXC 106). Each backup job pushes
# to {{ uptime_kuma_push_base }}/{{ vault_kuma_push_* }} (?status=up on success,
# ?status=down on failure). Kuma alerts when a push is late = a silently-dead
# cron, even while gallium is otherwise healthy. Not off-site on purpose: a
# whole-gallium outage is self-evident (Immich down), so the monitor lives in
# the LAN it watches (decision 2026-07-08).
uptime_kuma_push_base: "http://{{ uptime_ip }}:3001/api/push"

# --- uptime (Uptime Kuma) ---
uptime_ip: "192.168.1.65"
# Public-facing TLS name (real Let's Encrypt cert, same acme-on-adguard pattern
# as immich). Resolves internally (AdGuard rewrite → .65), never
# port-forwarded — HTTPS is for the human dashboard only; the backup jobs still
# push over http://uptime.lan:3001 (unchanged).
uptime_domain: "uptime.flefevre.fr"
# Pinned (never :latest). Stable v1 line — verify the latest patch tag on
# https://hub.docker.com/r/louislam/uptime-kuma/tags before bumping.
uptime_kuma_version: "1.23.16"

# --- home assistant (domotique) ---
# LXC 107. HA Container (no Supervisor) + Caddy, Docker Compose — why
# Container rather than HA OS: docs/home-assistant.md.
hassium_ip: "192.168.1.66"
# ZFS dataset holding Home Assistant's scheduled backups — not the LXC rootfs,
# so it survives a rebuild of LXC 107. Same shape as immich_photos_dataset:
# created by the "Provision ZFS datasets" play, bind-mounted read-write into
# hassium (terraform/hassium.tf) and read-only into the backup LXC
# (terraform/backup.tf), which ships it to Scaleway + HDD.
hassium_backups_dataset: "rpool/data/hassium-backups"
# Where that dataset appears INSIDE the hassium LXC; docker-compose.yml.j2
# mounts it over the container's /config/backups.
homeassistant_backups_mount: "/mnt/hassium-backups"
# Internal-only TLS name (AdGuard rewrite → .66), never port-forwarded — same
# acme-on-adguard pattern as immich/uptime. Also the base URL of the ha-mcp
# endpoint Claude Code connects to (/<vault_ha_mcp_secret_path>, routed by
# Caddy to the ha-mcp sidecar — docs/home-assistant.md). Matches the LXC hostname
# `hassium` (Hs, 108 — it contains "hass", Home Assistant's original name, still
# its binary's): hassium.lan / hassium.flefevre.fr, the standard
# <hostname>.lan / <hostname>.flefevre.fr pair of the CLAUDE.md checklist.
homeassistant_domain: "hassium.flefevre.fr"
# PRIVATE repo whose root IS Home Assistant's /config (configuration.yaml,
# automations…): it describes how the home is used, and this repo is public.
# Install-type agnostic — HA OS would consume the same repo
# through the Git pull app. Resolved on the CONTROL node, relative to ansible/:
# both repos side by side under the same parent. The role fails if it is
# missing, and if its internal_url disagrees with homeassistant_domain above.
homeassistant_config_repo_dir: "{{ playbook_dir }}/../../hassium-automation"
# Pinned (never :latest / :stable). HA ships a feature release every month;
# check https://github.com/home-assistant/core/releases before bumping.
# ⚠️ Recorder schema migrations are one-way — there is no downgrade once HA has
# started on a newer version. Take a PBS snapshot before a major bump.
homeassistant_version: "2026.10.2"
# Digest of the multi-arch INDEX for that tag (content-type
# application/vnd.oci.image.index.v1+json — not a per-platform manifest, so the
# same value works on any architecture). Bump it together with the version:
#   docker pull ghcr.io/home-assistant/home-assistant:<ver>
#   docker inspect --format '{{index .RepoDigests 0}}' \
#     ghcr.io/home-assistant/home-assistant:<ver>
# and copy the sha256:... part. A tag can be re-pushed; a digest cannot.
homeassistant_image_digest: "sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4"
# ha-mcp (homeassistant-ai/ha-mcp), the MCP server sidecar Claude Code drives
# Home Assistant through. Pinned the same way as HA: version AND multi-arch index
# digest. Check https://github.com/homeassistant-ai/ha-mcp/releases before
# bumping, then refresh the digest with the same docker pull/inspect recipe
# against ghcr.io/homeassistant-ai/ha-mcp:<ver>.
ha_mcp_version: "8.7.0"
ha_mcp_image_digest: "sha256:600677bbd7574dfb59682e40d6945f73fcc8852d3684b3671506602473942448"

# --- palladium (internet-facing gateway) ---
# LXC 108, the ONLY host the Livebox forwards to (443). Caddy requires a client
# certificate (mTLS) for homeassistant_domain and immich_domain, and serves
# share links through immich-public-proxy without one — docs/palladium.md.
palladium_ip: "192.168.1.68"
# Share links Immich hands out (Administration → External domain). Served by
# immich-public-proxy: shared albums only, read-only, behind the share password.
immich_share_domain: "share.flefevre.fr"
# Pinned like HA: version AND multi-arch index digest. Check
# https://github.com/alangrainger/immich-public-proxy/releases before bumping,
# then refresh the digest (Docker Hub tag page, or docker pull + inspect).
immich_public_proxy_version: "4.1.2"
immich_public_proxy_image_digest: "sha256:d6480d1e6beb3da661cb895e1b368340df48904ecbfe53ece2d5da343e78b857"

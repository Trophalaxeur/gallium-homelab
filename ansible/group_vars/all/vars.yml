---
proxmox_node: "gallium"
proxmox_ip: "192.168.1.32"
adguard_ip: "192.168.1.53"
thallium_ip: "192.168.1.20"
neon_ip: "192.168.1.60"
bromine_ip: "192.168.1.61"
pbs_ip: "192.168.1.62"
immich_ip: "192.168.1.63"
adguard_admin_user: "admin"
adguard_domain: "adguard.flefevre.fr"
acme_email: "admin@flefevre.fr"

# --- neon ---
smtp_host: "smtp.gmail.com"
smtp_port: 587
smtp_user: "me@flefevre.fr"
smtp_from: "neon@flefevre.fr"
neon_admin_email: "admin@flefevre.fr"
# Admin SSH public key — used by Ansible to authorize neonuser (Terraform handles root)
ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpw+OdkwiB/HsgN7V3Vj/FNQI+tX7HsjNAPltIWdXTp flefevre@thallium"

# --- bromine ---
bromine_admin_email: "admin@flefevre.fr"
smtp_from_bromine: "bromine@flefevre.fr"
bromine_domain: "bromine.flefevre.fr"
# The acme.sh ssh deploy-hook key (adguard → bromine, certdeploy user) is
# generated on adguard at deploy time (playbook.yml adguard play) — no static
# pubkey or vault secret. The bromine play reads the public half from adguard's
# facts. See docs/bromine.md ("How TLS is wired").

# --- immich ---
# ZFS dataset for photos + Immich's own DB dumps (backup=no equivalent — not a
# container rootfs, excluded from PBS by nature). Shared by the "Provision ZFS
# dataset" play, the zfs-maintenance sanoid template, and the immich LXC's
# Terraform mount_point (terraform/immich.tf) — single source of truth.
immich_photos_dataset: "rpool/data/immich-photos"
immich_admin_email: "admin@flefevre.fr"
# Public-facing name (registered at Online.net → 90.76.179.86, port-forwarded
# on the Livebox). immich.lan stays the internal/technical AdGuard name
# (matches the LXC hostname, like adguard.lan/bromine.lan/pbs.lan) — only the
# public domain changed, decision 2026-07-07.
immich_domain: "photos.flefevre.fr"
immich_version: "v3.0.1"
smtp_from_immich: "immich@flefevre.fr"

# --- backup ---
# Isolated LXC (105) that runs the rclone/HDD/object-lock jobs — never Immich
# itself (Scénario 6 isolation, ~/.claude/plans/backup-strategy.md).
backup_ip: "192.168.1.64"
backup_admin_email: "admin@flefevre.fr"
smtp_from_backup: "backup@flefevre.fr"

# Bind-mount paths INSIDE the backup LXC (posted by terraform/backup.tf):
#   immich photos, READ-ONLY  ·  external HDD, writable (3rd physical copy)
backup_photos_src: "/mnt/immich-photos"
backup_hdd_mount: "/mnt/hdd"

# Scaleway Object Storage (bucket bootstrapped by
# scripts/scaleway-bucket-bootstrap.sh — Object Lock Compliance + SSE-ONE).
# ⚠️ scaleway_region MUST match SCW_REGION in scripts/.scaleway-credentials.env.
scaleway_bucket: "homelab-photos-backup"
scaleway_region: "fr-par"
scaleway_endpoint: "https://s3.fr-par.scw.cloud"
# rclone remote name written into /root/.config/rclone/rclone.conf
rclone_remote: "scaleway"
# Object Lock Compliance window (days) re-applied on every upload and renewed
# weekly on still-present library/ objects (Rétention glissante).
object_lock_days: 90

# Deadman switches → self-hosted Uptime Kuma (LXC 106). Each backup job pushes
# to {{ uptime_kuma_push_base }}/{{ vault_kuma_push_* }} (?status=up on success,
# ?status=down on failure). Kuma alerts when a push is late = a silently-dead
# cron, even while gallium is otherwise healthy. Not off-site on purpose: a
# whole-gallium outage is self-evident (Immich down), so the monitor lives in
# the LAN it watches (decision 2026-07-08).
uptime_kuma_push_base: "http://{{ uptime_ip }}:3001/api/push"

# --- uptime (Uptime Kuma) ---
uptime_ip: "192.168.1.65"
# Public-facing TLS name (real Let's Encrypt cert, same acme-on-adguard pattern
# as immich/bromine). Resolves internally (AdGuard rewrite → .65), never
# port-forwarded — HTTPS is for the human dashboard only; the backup jobs still
# push over http://uptime.lan:3001 (unchanged).
uptime_domain: "uptime.flefevre.fr"
# Pinned (never :latest). Stable v1 line — verify the latest patch tag on
# https://hub.docker.com/r/louislam/uptime-kuma/tags before bumping.
uptime_kuma_version: "1.23.16"
